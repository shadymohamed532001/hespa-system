services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-hesba}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?ضع DB_PASSWORD في ملف .env.production}
      POSTGRES_DB: ${DB_NAME:-hesba}
    volumes:
      - hesba_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hesba} -d ${DB_NAME:-hesba}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_SYNC: "false"
      MIGRATIONS_RUN: "false"
      SEED_DEMO_DATA: "false"
      TRUST_PROXY: "1"
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    volumes:
      - ./backend/secrets:/app/secrets:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - internal
      - proxy

volumes:
  hesba_postgres_data:

networks:
  internal:
    internal: true
  proxy:
