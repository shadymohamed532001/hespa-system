services:
  postgres:
    image: postgres:17-alpine
    container_name: hesba-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hesba
      POSTGRES_PASSWORD: hesba
      POSTGRES_DB: hesba
    ports:
      - "5432:5432"
    volumes:
      - hesba_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hesba -d hesba"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hesba_postgres_data:
