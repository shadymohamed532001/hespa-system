name: Desktop installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the installer to
        required: true
        type: string
      platform:
        description: Installer to build
        required: true
        default: windows
        type: choice
        options:
          - windows
          - macos
          - linux
          - all

permissions:
  contents: write

jobs:
  macos:
    if: github.event_name == 'push' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'macos'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
        working-directory: frontend
      - run: ./packaging/build-macos-dmg.sh
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          HESBA_VERSION: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: artifacts/*.dmg
          overwrite_files: true

  windows:
    if: github.event_name == 'push' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
        working-directory: frontend
      - run: flutter build windows --release --dart-define="API_BASE_URL=${{ vars.API_BASE_URL }}"
        working-directory: frontend
      - run: choco install innosetup --yes --no-progress
      - shell: pwsh
        run: |
          $version = "${{ github.event.inputs.tag || github.ref_name }}" -replace '^v', ''
          iscc "/DMyAppVersion=$version" packaging/windows/hesba.iss
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: artifacts/*.exe
          overwrite_files: true

  linux:
    if: github.event_name == 'push' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'linux'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
        working-directory: frontend
      - run: ./packaging/build-linux-deb.sh
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          HESBA_VERSION: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: artifacts/*.deb
          overwrite_files: true
