name: Production Windows build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version to build
        required: true
        type: string
      platform:
        description: Platform
        required: true
        default: windows
        type: choice
        options: [windows]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.6'
          cache: true
      - run: flutter pub get
        working-directory: frontend
      - shell: pwsh
        working-directory: frontend
        run: |
          $version = "${{ inputs.tag }}" -replace '^v', ''
          flutter build windows --release --build-name="$version" --build-number=117 --dart-define="HESBA_APP_FLAVOR=prod" --dart-define="API_BASE_URL=https://hesba.alien-fit.com/api"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: choco install innosetup --yes --no-progress
      - shell: pwsh
        run: |
          $version = "${{ inputs.tag }}" -replace '^v', ''
          iscc "/DMyAppVersion=$version" packaging/windows/hesba.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path frontend/build/windows/x64/runner/Release/* -DestinationPath "artifacts/Hesba-$version-windows-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Hesba-${{ inputs.tag }}-windows-production
          path: |
            artifacts/*.exe
            artifacts/*-windows-portable.zip
          if-no-files-found: error
          retention-days: 14
